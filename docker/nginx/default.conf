server {
    listen 80 default_server;
    server_name _;

    root /app/public;

    client_max_body_size 8m;

    # Do not advertise the stack.
    server_tokens off;

    # Sent on every response, error pages included (always).
    #
    # HSTS is meaningful only over TLS and browsers ignore it on plain HTTP, so
    # it is safe here and correct once a terminator sits in front. If TLS is
    # terminated upstream, let that layer own this header instead of duplicating.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A JSON API has no business leaking its URLs — which carry resource ids —
    # to third parties through the Referer header.
    add_header Referrer-Policy "no-referrer" always;

    # Nothing here is a browser document, so every powerful feature is denied.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Belt and braces: API Platform already sets these, but an error served by
    # nginx itself never reaches PHP.
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Symfony front controller. Nothing else in public/ may be executed.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Long enough for migrations/fixtures triggered over HTTP in dev.
        fastcgi_read_timeout 60s;

        internal;
    }

    # Any other .php file is a 404, never source disclosure.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # Development console (public/console.html) — a manual testing tool, not part
    # of the API. It exposes nothing the API does not, but it has no business
    # being deployed: either omit the file from the production image, or
    # uncomment the block below.
    # location = /console.html {
    #     return 404;
    # }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
