; Pool overrides. Deliberately does NOT set user/group: the container runs as the
; host UID/GID (see compose.yaml), so FPM is already the right user and would only
; log "directive ignored when FPM is not running as root".

[www]
listen = 9000

; Surface PHP warnings/errors in `docker compose logs php`.
catch_workers_output = yes
decorate_workers_output = no

; Symfony reads env vars from the FPM environment.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
