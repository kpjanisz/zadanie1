nelmio_cors:
    defaults:
        origin_regex: false
        # Explicit origins only. A wildcard here would let any site call the API
        # with the browser's credentials.
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'POST', 'PATCH', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api': null
