_security_logout:
    resource: security.route_loader.logout
    type: service

# Handled entirely by the json_login listener on the `auth` firewall; the route
# only has to exist for the listener to be reachable.
api_auth_login:
    path: /api/auth/login
    methods: [POST]

# Handled by the logout listener on the `auth` firewall. Gesdinet hooks the
# LogoutEvent and invalidates the refresh token sent in the request body.
api_auth_logout:
    path: /api/auth/logout
    methods: [POST]
